<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/20px system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #111827; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: 0 0 auto; }
    .dot.on { background: #10b981; }
    .dot.off { background: #ef4444; }
    label { display: block; margin: 10px 0 4px; color: #374151; }
    input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: 12px/18px monospace; }
    button { margin: 8px 0; padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #f3f4f6; cursor: pointer; }
    button:hover { background: #e5e7eb; }
    .err { min-height: 18px; margin: 6px 0; color: #b45309; word-break: break-all; }
    .dbg { min-height: 16px; margin: 0 0 4px; color: #6b7280; font-size: 11px; word-break: break-all; }
    .tl { margin: 2px 0 4px; color: #6b7280; font: 11px/15px monospace; white-space: pre-line; word-break: break-all; }
    .opts { margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 6px; }
    .diagHead { display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #374151; font-size: 12px; user-select: none; }
    .diagHead:hover { color: #111827; }
    .diagHead .arrow { font-size: 10px; }
  </style>
</head>
<body>
  <h1>Agent Bridge</h1>
  <div class="row"><span id="dot" class="dot"></span><span id="status">…</span></div>
  <div id="err" class="err"></div>
  <div id="dbg" class="dbg"></div>
  <div id="guard" class="dbg"></div>
  <div class="opts">
    <div id="diagHead" class="diagHead"><span>诊断详情（keepalive / 驱动日志 / 时间线）</span><span id="diagArrow" class="arrow">▸</span></div>
    <div id="diagBody" style="display:none">
      <div class="row"><span id="kaDot" class="dot"></span><span id="kaState" class="dbg" style="margin:0;flex:1">keepalive：…</span></div>
      <div id="driveLog" class="tl"></div>
      <div id="kaTimeline" class="tl"></div>
      <div id="bgState" class="tl"></div>
    </div>
  </div>
  <label>服务端 Token（server/config.local.json）</label>
  <input id="token" type="password" placeholder="粘贴 64 位 token">
  <button id="save">保存并测试连接</button>
  <button id="injectPrompt">注入协议到当前标签</button>
  <button id="miniPopout" title="把当前 AI 标签弹成独立小窗：小窗保持「可见」状态，站点脚本不被 Chrome 后台节流，后台任务恢复前台速度。注意：小窗不要被完全遮挡、不要最小化">小窗加速（后台全速执行）</button>
  <div id="miniState" class="dbg"></div>
  <button id="rotateToken">轮换 Token（旧 token 立即失效）</button>
  <button id="openHealth">健康自检页</button>
  <div class="mode" style="border:1px solid #374151;border-radius:8px;padding:8px;margin:8px 0">
    <label><input type="checkbox" id="outOfRoots"> 完全批准模式（越界文件与白名单外命令直接执行，仅黑名单拦截，不再弹确认条）</label>
    <div id="modeState" class="dbg">读取当前模式…</div>
  </div>
  <div class="opts">
    <div class="row"><label><input id="autoSend" type="checkbox"> 自动发送执行结果</label></div>
    <div class="row"><label><input id="paused" type="checkbox"> 暂停监听（不执行新指令）</label></div>
    <div class="row"><label style="margin:0">单任务步数上限</label><input id="maxSteps" type="number" min="10" max="100" step="5" style="width:64px"></div>
    <button id="reset">新任务（重置计数与熔断）</button>
    <button id="testConfirm">测试确认条 UI</button>
  </div>
  <div class="opts">
    <label style="margin-top:0">站点域名自适应（站点改域名后免改 manifest）</label>
    <button id="probeDomains">检测站点域名跳转</button>
    <div class="row"><input id="extraDomain" type="text" placeholder="手动加域名，如 chat.qwen.ai" style="flex:1;font:12px/18px monospace;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box"><button id="addDomain" style="margin:0">添加</button></div>
    <div id="domainState" class="dbg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
